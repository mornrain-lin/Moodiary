<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Moodiary · 隐私优先的情绪日记 —— 纯前端、零依赖、可离线安装。记录每天的心情，看见情绪的趋势。" />
  <meta name="keywords" content="mood diary,情绪日记,心情记录,mental health,隐私,pwa" />
  <meta property="og:title" content="Moodiary · 隐私优先的情绪日记" />
  <meta property="og:description" content="纯前端、零依赖、可离线安装的情绪日记 Web 应用。数据只属于你。" />
  <meta property="og:type" content="website" />
  <title>Moodiary · 隐私优先的情绪日记</title>
  <link rel="manifest" href="assets/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-theme="light">
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <img src="assets/icons/icon.svg" alt="" class="brand-logo" width="34" height="34" />
      <div class="brand-text">
        <span class="brand-name">Moodiary</span>
        <span class="brand-tag" data-i18n="brand.tag">隐私优先的情绪日记</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="langBtn" class="icon-btn" title="Language" aria-label="切换语言">中 / EN</button>
      <button id="themeBtn" class="icon-btn" title="Theme" aria-label="切换主题">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- 今日记录 -->
    <section class="card today-card" aria-labelledby="todayTitle">
      <div class="today-head">
        <h2 id="todayTitle" data-i18n="today.title">今天感觉如何？</h2>
        <span id="todayDate" class="today-date"></span>
      </div>

      <div class="mood-picker" id="moodPicker" role="radiogroup" aria-label="mood"></div>

      <textarea id="noteInput" class="note-input" rows="3" maxlength="280"
        data-i18n-ph="today.notePlaceholder" placeholder="写点什么吧（可选）…"></textarea>

      <div class="tag-area">
        <div class="tag-label" data-i18n="today.tags">标签</div>
        <div class="tag-chips" id="tagChips"></div>
      </div>

      <div class="today-actions">
        <button id="saveBtn" class="btn btn-primary" data-i18n="today.save">保存今天</button>
        <span id="saveHint" class="save-hint"></span>
      </div>
    </section>

    <!-- 统计概览 -->
    <section class="stats-grid" aria-label="stats">
      <div class="stat-card">
        <div class="stat-value" id="statStreak">0</div>
        <div class="stat-label" data-i18n="stat.streak">连续记录</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label" data-i18n="stat.total">总记录</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statAvg">–</div>
        <div class="stat-label" data-i18n="stat.avg">平均心情</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statBest">–</div>
        <div class="stat-label" data-i18n="stat.best">最常见心情</div>
      </div>
    </section>

    <!-- 日历热力图 -->
    <section class="card" aria-labelledby="heatTitle">
      <div class="card-head">
        <h3 id="heatTitle" data-i18n="heat.title">心情日历</h3>
        <div class="legend" id="heatLegend"></div>
      </div>
      <div class="heatmap-wrap">
        <div id="heatmap" class="heatmap"></div>
      </div>
    </section>

    <!-- 情绪趋势 -->
    <section class="card" aria-labelledby="trendTitle">
      <div class="card-head">
        <h3 id="trendTitle" data-i18n="trend.title">情绪趋势</h3>
        <div class="range-tabs" id="rangeTabs">
          <button class="range-tab active" data-range="30">30</button>
          <button class="range-tab" data-range="90">90</button>
          <button class="range-tab" data-range="180">180</button>
        </div>
      </div>
      <div id="trendChart" class="trend-chart"></div>
    </section>

    <!-- 标签统计 -->
    <section class="card" aria-labelledby="tagTitle">
      <div class="card-head">
        <h3 id="tagTitle" data-i18n="tags.title">标签与心情</h3>
      </div>
      <div id="tagStats" class="tag-stats"></div>
    </section>

    <!-- 数据管理 -->
    <section class="card data-card" aria-labelledby="dataTitle">
      <div class="card-head">
        <h3 id="dataTitle" data-i18n="data.title">你的数据</h3>
      </div>
      <p class="data-desc" data-i18n="data.desc">所有数据都只保存在这台设备上（localStorage），不会上传到任何服务器。</p>
      <div class="data-actions">
        <button id="exportBtn" class="btn btn-ghost" data-i18n="data.export">导出备份</button>
        <label class="btn btn-ghost" for="importFile" data-i18n="data.import">导入备份</label>
        <input id="importFile" type="file" accept="application/json" hidden />
        <button id="sampleBtn" class="btn btn-ghost" data-i18n="data.sample">载入示例</button>
        <button id="resetBtn" class="btn btn-danger" data-i18n="data.reset">清空数据</button>
      </div>
    </section>

    <footer class="footer">
      <span>Moodiary · <span data-i18n="footer.made">用☕与☁️打造的隐私优先小工具</span></span>
      <a href="https://github.com" id="repoLink" class="footer-link" data-i18n="footer.source">查看源码</a>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
